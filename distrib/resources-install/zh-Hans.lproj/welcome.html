<body>
<h2>开始之前</h2>
<p>此程序将安装 Sister HL-2030，这是 Brother HL-2030 系列打印机的原生驱动程序。</p>
<p>继续之前，请：</p>
<ol>
<li>用 USB 数据线将打印机连接到这台 Mac，并打开打印机电源。</li>
<li>确认没有安装 Brother 驱动程序。如果你在这台电脑上安装过它们，请运行 <b>UninstallBrotherDrivers.pkg</b> 将其卸载。</li>
</ol>
<p>点按“继续”以继续。</p>
</body>
