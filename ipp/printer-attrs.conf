# SisterHL2030 IPP Everywhere attributes for ippeveprinter -a.
#
# Margins are 1 (0.01 mm), not 0. Apple's ipp2ppd treats 0 as
# "A4.Borderless" and the print dialog then Scale-to-Fits at ~96%.
# 0.01 mm still rounds to 100% scale. The laser clips a few millimetres
# at the physical edge regardless.

ATTR boolean color-supported false
ATTR integer copies-default 1
ATTR rangeOfInteger copies-supported 1-1
ATTR enum finishings-default 3
ATTR enum finishings-supported 3

ATTR integer media-bottom-margin-supported 1
ATTR integer media-left-margin-supported 1
ATTR integer media-right-margin-supported 1
ATTR integer media-top-margin-supported 1

ATTR collection media-col-database {
    MEMBER keyword media-key "na_letter_8.5x11in"
    MEMBER collection media-size {
        MEMBER integer x-dimension 21590
        MEMBER integer y-dimension 27940
    }
    MEMBER keyword media-size-name "na_letter_8.5x11in"
    MEMBER integer media-bottom-margin 1
    MEMBER integer media-left-margin 1
    MEMBER integer media-right-margin 1
    MEMBER integer media-top-margin 1
},{
